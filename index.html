<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizan</title>
    <script type="module" src="./js/app.js" defer></script>
    <link rel="stylesheet" href="./css/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"> 
</head>
<body>
    <header class="flex flex-row justify-between py-2 px-6">
        <div class="flex gap-3 ">
            <div>
             <img src="./src/icons/Gold Scales and Bullion Icon.ico" alt="Gold Scales and Bullion Icon" class="h-16">
            </div>
            <div>
                <p class="text-primary text-2xl font-semibold">MIZAN</p>
                <p class="text-muted">Bijoutrie Al Andalous</p>
            </div>
        </div>
        <p class="text-green-500 text-center border rounded-2xl bg-green-100 h-2/3 px-4 py-1">En ligne</p>
    </header>
    <hr class="px-10">
    <main>
        
        <section class="flex justify-between px-4 py-2">
            <div class="flex flex-col gap-2">
                <p class="text-xl text-text font-bold">Cours des métaux</p>
                <p class="text-xl text-muted ">dernièr mes à jour: <span id="last-update-time"></span></p>
            </div>
            <div class="flex flex-col items-center gap-2">
                <button id="refresh-cards" class="text-text text-xl text-center border-2 rounded-2xl px-2 w-4/5 hover:bg-gray-500 focus:shadow-2xl"><i class="fa-solid fa-arrows-rotate"></i> <span id="refresh-textcontent">Actualiser</span></button>
            </div>
        </section>
        <hr>
        <section class="py-4">
            <div class="flex justify-between px-2">
                <p class="text-xl text-bold">Prix Actuels</p>
                <select name="currency" id="select-currency" class="border text-lg rounded-2xl px-3 py-1">
                    <option value="MAD">MAD</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                </select>
            </div>
            <div>
                <p id="cards-status"></p>
            </div>
            <div id="metals-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-2 p-3">

            </div>
        </section>
        <section class="border-t p-2">
            <h2 class="text-2xl text-text">Historique des prix</h2>
            <div class="flex justify-between">
                <select name="currency" id="history-select-metal" class="border text-lg rounded-2xl px-3 py-1 mt-1">
                    <option value="xau">Or</option>
                    <option value="silver">Argent</option>
                </select>
                <div class="text-xl [&>button]:border-0 [&>button]:bg-gray-300 [&>button]:rounded-2xl [&>button]:py-1 [&>button]:px-4">
                    <button id="history-week">7 jours</button>
                    <button id="history-month">30 jours</button>
                </div>
                
            </div>
            <div>
                <p id="history-status"></p>
            </div>
            <div class="chart-container">
                    <svg id="history-chart"
                         viewBox="0 0 800 300"
                         role="img"
                         aria-label="Historique des prix des métaux">
                    </svg>
                </div>
        </section>
        <section class="border-t p-2">
            <h2 class="text-2xl ">Estimateur de bijou</h2>
            <div class="my-2 flex flex-col gap-2 md:flex-row">
                <label for="weigth-input" class="text-muted text-lg">Poids (grammes): </label>
                <input type="number" inputmode="numeric" id="weigth-input" class="border w-2/3 py-1 px-4 rounded-lg border-gray-400">
                <p id="weigth-input-error" class="error hidden"></p>

                <label for="calculation-select-metal" class="text-muted text-lg">Metals: </label>
                <select name="metal" id="calculation-select-metal" class="border text-lg rounded-lg border-gray-400 px-3 py-1 mt-1 w-2/3">
                    <option value="xau">Or</option>
                    <option value="silver">Argent</option>
                </select>
            </div>
            <div class="text-center ">
                <button id="calculate-estimated-price" class="text-2xl text-white font-semibold border-2 rounded-2xl bg-slate-600 p-2 hover:bg-slate-900 focus:shadow-2xl">Calculer</button>
            </div>
            <div>
                <p class="text-lg text-text">Valeur estimée</p>
                <p class="text-xl font-bold"><span id="valeur-estimee" class="text-3xl font-light italic">---</span> <span id="valeur-estimee-currency"></span></p>
            </div>
        </section>

        <template id="metals-template">
           <article class="bg-gray-300 border border-border rounded-xl p-4">
                <h3 class="text-2xl">
                    <span id="metal-color" class=""><i class="fa-solid fa-circle"></i></span>
                    <span id="metal-name"></span></h3>
                <p class="text-3xl">
                    <span id="metal-price"></span>
                    <span id="metal-currency"></span>
                    / 
                    <span id="metal-unit" ></span></p>
                    
                <p class="text-xl"></p>
                <p id="metal-change" class="text-lg"></p>
                <p class="text-lg">
                    <span class="arrow-up hidden text-green-500"><i class="fa-solid fa-arrow-trend-up"></i></span>
                    <span class="arrow-down hidden text-red-500"><i class="fa-solid fa-arrow-trend-down"></i></span>
                    <span id="metal-change-rate"></span>
                </p>
                
           </article>
        </template>
    </main>
    <footer class="border-t flex justify-between px-2 py-4">
        <p>Mizan . Cours des métaux</p>
        <p>État : Opérationnel</p>
    </footer>
</body>
</html>
